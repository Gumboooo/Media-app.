name: Native Windows player
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      # The repository's trailing dot is invalid in a normal Windows checkout path.
      - name: Checkout exact commit into a Windows-safe directory
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutPath = Join-Path $env:RUNNER_TEMP 'aperture-source'
          git init $checkoutPath
          if ($LASTEXITCODE) { throw 'git init failed' }
          Set-Location $checkoutPath
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Commit mismatch' }
      - name: Install Qt 6.8.3
        shell: pwsh
        working-directory: ${{ runner.temp }}/aperture-source
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { throw 'Qt installer setup failed' }
          $qtDir = Join-Path $env:RUNNER_TEMP 'aperture-qt'
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O $qtDir
          if ($LASTEXITCODE) { throw 'Qt installation failed' }
          $qtRoot = Join-Path $qtDir '6.8.3/msvc2022_64'
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QMAKE=$qtRoot/bin/qmake.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$qtRoot/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test, build, package, and smoke-test player
        shell: pwsh
        working-directory: ${{ runner.temp }}/aperture-source
        run: |
          ./tools/windows-build.ps1
      - name: Verify packaged GUI and capture rendered window
        shell: pwsh
        working-directory: ${{ runner.temp }}/aperture-source
        run: |
          ./tools/capture-windows-ui.ps1
      - name: Build and smoke-test single-file installer
        shell: pwsh
        working-directory: ${{ runner.temp }}/aperture-source
        run: |
          ./tools/windows-installer.ps1
      - name: Keep build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build-evidence
          path: |
            ${{ runner.temp }}/aperture-source/build/evidence/
            ${{ runner.temp }}/aperture-source/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
      - name: Upload tested development bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aperture-windows-x64-dev
          path: ${{ runner.temp }}/aperture-source/build/aperture-windows-x64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload tested installer EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aperture-windows-x64-installer
          path: ${{ runner.temp }}/aperture-source/build/installer/Aperture-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
