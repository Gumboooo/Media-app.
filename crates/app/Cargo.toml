[package]
name = "aperture-app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "aperture"
path = "src/main.rs"

[dependencies]
aperture-core = { path = "../core" }
aperture-vlc = { path = "../vlc" }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
qt-build-utils = { version = "0.10", features = ["qt_minimal"] }
qt-version = { version = "0.1", features = ["qt_version_at_least_6_8"] }
